# Ruft einmal pro Woche die Datenbank an, damit das Gratisprojekt bei Supabase nicht pausiert wird.
name: Datenbank wachhalten
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Dateien holen
        uses: actions/checkout@v4
      - name: Ping
        run: |
          URL=$(node -e "console.log(require('./config.json').url)")
          KEY=$(node -e "console.log(require('./config.json').anonKey)")
          curl -fsS -X POST "$URL/rest/v1/rpc/ping" -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}'
