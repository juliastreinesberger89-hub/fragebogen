<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Vorabfragebogen | Soulful Ease &amp; Energy</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --head:#a97b4f; --bg:#FAF3F1; --card:#FFFFFF; --ink:#1a1415; --soft:#6f6265; --line:#e4d3cf; --accent:#BE327B; --accent-dark:#9f2866; --tint:#f6e3ea;
  --serif:'Playfair Display',Georgia,serif; --sans:'Nunito Sans','Avenir Next',Avenir,system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:17px;line-height:1.55}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 120px}
header.brand{padding:28px 0 8px;text-align:center}
.brand .name{font-family:var(--serif);font-size:30px;letter-spacing:.01em;line-height:1.15}
.brand .by{font-family:var(--serif);font-size:34px;line-height:1.2;color:var(--head);margin-top:30px;font-weight:400}
@media (max-width:560px){.brand .by{font-size:28px;margin-top:24px}}
.progress{margin:22px 0 6px}
.progress .bar{height:3px;background:var(--line);position:relative}
.progress .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);transition:width .35s}
.progress .labels{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:var(--soft);font-weight:400}
.progress .labels span.on{color:var(--ink);font-weight:600}
@media (max-width:560px){.progress .labels span:not(.on){display:none}.progress .labels{justify-content:center}}
.saved{font-size:13px;color:var(--soft);text-align:center;margin:8px 0 0;min-height:18px}
.card{background:var(--card);border:1px solid var(--line);padding:26px 22px;margin-top:18px}
@media (min-width:600px){.card{padding:34px 38px}}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;color:var(--head)}
.brand .logo{display:block;width:210px;max-width:60%;height:auto;margin:0 auto 4px;mix-blend-mode:multiply}
.opts.big .opt{color:var(--head)}
.steptitle{font-size:30px;margin-bottom:6px}
.stepsub{color:var(--soft);margin:0 0 6px}
.field{margin-top:30px}
.field.hidden{display:none}
.field > .lbl{display:block;font-size:17px;font-weight:600;line-height:1.4;margin-bottom:6px}
.field > .lbl .req{color:var(--accent)}
.field > .desc{font-size:15px;color:var(--soft);margin:0 0 10px;font-weight:300}
.divider{margin-top:46px;padding-top:26px;border-top:1px solid var(--line)}
.divider h2{font-size:26px}
.content{margin-top:6px}
.content p{margin:0 0 14px}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],textarea{
  width:100%;font:inherit;font-weight:400;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:0;padding:12px 14px;outline:none;transition:border-color .15s, box-shadow .15s}
textarea{min-height:110px;resize:vertical}
input:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(190,50,123,.12)}
.opts{display:grid;gap:8px;margin-top:6px}
.opts.grid{grid-template-columns:1fr}
@media (min-width:640px){.opts.grid{grid-template-columns:1fr 1fr}}
.opt{position:relative;display:flex;align-items:flex-start;gap:12px;border:1px solid var(--line);background:#fff;padding:11px 14px;cursor:pointer;transition:border-color .15s,background .15s;font-weight:400;line-height:1.4}
.opt:hover{border-color:#c9a9b8}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .mark{flex:0 0 20px;height:20px;margin-top:1px;border:1.5px solid #bda4ad;background:#fff;display:flex;align-items:center;justify-content:center;transition:all .15s}
.opt.radio .mark{border-radius:50%}
.opt input:checked ~ .mark{background:var(--accent);border-color:var(--accent)}
.opt input:checked ~ .mark::after{content:"";width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.opt.radio input:checked ~ .mark::after{width:8px;height:8px;border:0;border-radius:50%;background:#fff;transform:none}
.opt:has(input:checked){border-color:var(--accent);background:var(--tint)}
.opt:has(input:focus-visible){box-shadow:0 0 0 3px rgba(190,50,123,.2)}
.opts.big .opt{padding:18px 18px;font-size:17px;font-family:var(--serif);font-weight:400}
.opts.big{grid-template-columns:1fr}
@media (min-width:640px){.opts.big{grid-template-columns:1fr 1fr}}
.err{color:#b0233f;font-size:14px;margin-top:8px;display:none;font-weight:400}
.field.invalid .err{display:block}
.field.invalid input[type=text],.field.invalid input[type=email],.field.invalid input[type=date],.field.invalid textarea,.field.invalid .opt{border-color:#d98aa0}
.rep .row{display:grid;grid-template-columns:1fr;gap:8px;padding:12px;border:1px solid var(--line);margin-top:8px;background:#fffdfc;position:relative}
@media (min-width:640px){.rep .row{grid-template-columns:2fr 1.2fr 1fr}}
.rep .row small{color:var(--soft);display:block;font-size:12px;margin-bottom:2px;font-weight:400}
.rep .rm{position:absolute;right:6px;top:2px;background:none;border:0;font-size:20px;color:var(--soft);cursor:pointer}
.link{background:none;border:0;color:var(--accent);font:inherit;font-weight:600;cursor:pointer;padding:8px 0;text-decoration:underline;text-underline-offset:3px}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(250,243,241,.96);backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:12px 16px;z-index:5}
.nav .in{max-width:760px;margin:0 auto;display:flex;gap:12px;justify-content:space-between}
.btn{font:inherit;font-weight:600;letter-spacing:.04em;padding:13px 28px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;transition:all .15s}
.btn:hover{background:var(--ink);color:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;flex:1;max-width:320px;margin-left:auto}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn[disabled]{opacity:.4;pointer-events:none}
.done{text-align:center;padding:30px 4px}
.done h2{font-size:32px;margin-bottom:14px}
.demo{background:#fff7e0;border:1px solid #ecd48a;padding:10px 14px;font-size:14px;margin-top:16px;color:#5b4a14;font-weight:400}
.hint{font-size:13px;color:var(--soft);text-align:center;margin-top:26px}
</style>
</head>

<script>
const FORM = {"_type":"formsapp_form_export","_version":1,"exported_at":"2026-10-21T19:02:35.570Z","title":"Soulful Ease & Energy Vorabfragebogen","formType":"form","config":{"steps":[{"id":"step_1","title":"Ankommen","fields":[{"description":"","content":"\u003cp>Damit ich dich und deinen Körper besser kennenlernen und mich gut auf unsere Begleitung vorbereiten kann, schauen wir nicht nur darauf, was du isst oder wie viel du dich bewegst. Denn Gewicht und Wohlbefinden werden von vielen Dingen beeinflusst, zum Beispiel von deinem Zyklus, deinen Hormonen, deiner Verdauung, deinem Schlaf, deinem Stresslevel, deiner Energie und deinen bisherigen Erfahrungen.\u003c/p>\u003cp>Deine Antworten helfen mir dabei, mögliche Zusammenhänge zu erkennen und besser zu verstehen, was dein Körper gerade wirklich braucht. So können wir einen Weg finden, der zu dir, deinem Alltag und deinen Bedürfnissen passt, ohne starre Regeln, zusätzlichen Druck oder die nächste kurzfristige Diät.\u003c/p>\u003cp>\u003cb>Nimm dir bitte ausreichend Zeit. Du musst nichts perfekt beantworten. Es gibt keine richtigen oder falschen Antworten.\u003c/b> Falls eine Frage unklar sein sollte, schreib mir einfach kurz eine Nachricht, ich helfe dir gerne weiter!\u003c/p>\u003cp>Plane dir mindestens 30 Minuten ein und mach es dir dabei gern bei einer Tasse Tee gemütlich! Je nach deinen Themen siehst du auf der dritten Seite unterschiedliche Fragen.\u003c/p>","label":"Willkommen","id":"field_1","type":"content","required":false,"hideLabel":true,"readOnly":false,"conditionalLogic":{"enabled":false,"action":"show","rules":[{"group":[{"field":"","operator":"is","value":""}]}]}},{"description":"Pflichtfeld. Deine Daten werden auf Servern in Deutschland gespeichert und nur von Julia gelesen.","choices":["Ich willige ein, dass Julia Klausmayer die Angaben in diesem Fragebogen, auch meine Gesundheitsdaten, zur Vorbereitung und Durchführung der Begleitung verarbeitet und speichert. Ich kann diese Einwilligung jederzeit w const KEY = 'se_fragebogen_v1';

const steps = FORM.config.steps;

// ---------- Speicher (Browser dieses Geräts) ----------

function save() { try { localStorage.setItem(KEY, JSON.stringify({ answers, cur })); const el = document.getElementById('saved'); el.textContent = 'Dein Fortschritt wird auf diesem Gerät gespeichert.'; } catch (e) {} }

// ---------- Hilfen ----------
const h = (tag, attrs = {}, kids = []) => { const e = document.createElement(tag); for (const k in attrs) { if (k === 'class') e.className = attrs[k]; else if (k === 'html') e.innerHTML = attrs[k]; else if (k.startsWith('on')) e.addEventListener(k.slice(2), attrs[k]); else if (attrs[k] !== false && attrs[k] != null) e.setAttribute(k, attrs[k] === true ? '' : attrs[k]); } [].concat(kids).forEach(c => c != null && e.append(c.nodeType ? c : document.createTextNode(c))); return e; };
const flat = [];
(function walk(arr) { arr.forEach(f => { flat.push(f); (f.columns || []).forEach(c => walk(c.fields)); }); })(steps.flatMap(s => s.fields));
const byId = Object.fromEntries(flat.map(f => [f.id, f]));

// ---------- Regeln (ODER zwischen Gruppen, UND in einer Gruppe) ----------
function testRule(r) {
  const v = answers[r.field]; const arr = Array.isArray(v); const str = arr ? v.join(',') : (v == null ? '' : String(v)); const rv = String(r.value == null ? '' : r.value);
  switch (r.operator || 'is') {
    case 'is': return arr ? v.includes(r.value) : str === rv;
    case 'is_not': return arr ? !v.includes(r.value) : str !== rv;
    case 'contains': return str.toLowerCase().includes(rv.toLowerCase());
    case 'not_contains': return !str.toLowerCase().includes(rv.toLowerCase());
    case 'starts_with': return str.toLowerCase().startsWith(rv.toLowerCase());
    case 'ends_with': return rv !== '' && str.toLowerCase().endsWith(rv.toLowerCase());
    case 'greater_than': return parseFloat(str) > parseFloat(rv);
    case 'less_than': return parseFloat(str) < parseFloat(rv);
    case 'empty': return arr ? v.length === 0 : str === '';
    case 'not_empty': return arr ? v.length > 0 : str !== '';
  }
  return true;
}
function visible(f) {
  const cl = f.conditionalLogic; if (!cl || !cl.enabled || !(cl.rules || []).length) return true;
  const m = cl.rules.some(g => (g.group || []).every(testRule));
  return cl.action === 'hide' ? !m : m;
}
function applyVisibility() { flat.forEach(f => { const w = document.querySelector('[data-id="' + f.id + '"]'); if (w) w.classList.toggle('hidden', !visible(f)); }); }

// ---------- Rendern ----------
const BIG = ['Was beschäftigt dich gerade?', 'Welches Thema ist dir davon am wichtigsten?'];
function lbl(f) { return h('span', { class: 'lbl' }, [f.label, f.required ? h('span', { class: 'req' }, ' *') : null]); }
function onChange(f, val) { answers[f.id] = val; applyVisibility(); save(); fit(); }

function renderField(f) {
  const w = h('div', { class: 'field', 'data-id': f.id });
  const t = f.type;
  if (t === 'divider') { w.className = 'divider'; w.append(h('h2', {}, f.label)); return w; }
  if (t === 'content') { w.className = 'content'; w.append(h('div', { html: f.content })); return w; }
  w.append(lbl(f)); if (f.description) w.append(h('p', { class: 'desc' }, f.description));
  if (t === 'text' || t === 'email' || t === 'phone' || t === 'number' || t === 'date') {
    const type = { text: 'text', email: 'email', phone: 'tel', number: 'number', date: 'date' }[t];
    const i = h('input', { type, id: 'i_' + f.id, autocomplete: t === 'email' ? 'email' : 'off', inputmode: t === 'number' ? 'decimal' : null, min: t === 'number' && f.min !== '' ? f.min : null, max: t === 'number' && f.max !== '' ? f.max : null, oninput: e => onChange(f, e.target.value) });
    i.value = answers[f.id] || ''; w.append(i);
  } else if (t === 'textarea') {
    const i = h('textarea', { id: 'i_' + f.id, rows: f.rows || 4, oninput: e => onChange(f, e.target.value) }); i.value = answers[f.id] || ''; w.append(i);
  } else if (t === 'radio' || t === 'checkbox') {
    const big = BIG.some(b => f.label.startsWith(b)); const isR = t === 'radio';
    const box = h('div', { class: 'opts ' + (big ? 'big' : (f.choices.length > 6 ? 'grid' : '')) });
    f.choices.forEach(c => {
      const sel = isR ? answers[f.id] === c : (answers[f.id] || []).includes(c);
      const inp = h('input', { type: t, name: f.id, value: c, onchange: e => {
        if (isR) onChange(f, e.target.checked ? c : '');
        else { const a = new Set(answers[f.id] || []); e.target.checked ? a.add(c) : a.delete(c); onChange(f, [...a]); }
      } });
      inp.checked = sel;
      box.append(h('label', { class: 'opt ' + (isR ? 'radio' : '') }, [inp, h('span', { class: 'mark' }), h('span', {}, c)]));

  } else if (t === 'fileupload') {

      const list = [...e.target.files]; note.style.display = 'none';
      if (list.length > (f.maxFiles || 5)) { note.textContent = 'Bitte höchstens ' + (f.maxFiles || 5) + ' Dateien auswählen.'; note.style.display = 'block'; e.target.value = ''; fileObjs[f.id] = []; return; }
      if (list.some(x => x.size > 10 * 1024 * 1024)) { note.textContent = 'Eine Datei ist größer als 10 MB.'; note.style.display = 'block'; e.target.value = ''; fileObjs[f.id] = []; return; }
      fileObjs[f.id] = list;
    } }));
    w.append(note);
    w.append(h('p', { class: 'desc', style: 'margin-top:8px' }, 'Dateien werden erst beim Absenden hochgeladen.'));
  } else if (t === 'repeater') {
    const cols = f.columns[0].fields; const rows = () => (answers[f.id] = answers[f.id] && answers[f.id].length ? answers[f.id] : [{}]);
    const box = h('div', { class: 'rep' });

      box.innerHTML = '';
      rows().forEach((row, ri) => {
        const r = h('div', { class: 'row' });
        cols.forEach(c => { const i = h('input', { type: 'text', oninput: e => { row[c.id] = e.target.value; save(); } }); i.value = row[c.id] || ''; r.append(h('div', {}, [h('small', {}, c.label), i])); });
        if (rows().length > 1) r.append(h('button', { class: 'rm', type: 'button', 'aria-label': 'Zeile entfernen', onclick: () => { answers[f.id].splice(ri, 1); save(); draw(); fit(); } }, '×'));
        box.append(r);
      });
      box.append(h('button', { class: 'link', type: 'button', onclick: () => { answers[f.id].push({}); save(); draw(); fit(); } }, '+ weitere Zeile'));
    };
    draw(); w.append(box);
  }
  w.append(h('div', { class: 'err' }, 'Bitte ausfüllen.'));
  return w;
}

const main = document.getElementById('main');

function show() {

function validate() {

  pages[cur].querySelectorAll('.field').forEach(w => {

  document.querySelector('.nav').style.display = 'none'; document.querySelector('.progress').style.display = 'none'; document.getElementById('saved').style.display = 'none';

// ---------- Absenden an die Datenbank ----------
const answerOf = start => { const f = flat.find(x => x.label.startsWith(start)); return f ? answers[f.id] : undefined; };
function collect() {
  const out = [];
  steps.forEach(s => s.fields.forEach(f => {
    if (!visible(f)) return;
    if (f.type === 'divider') { out.push({ t: 'section', label: f.label }); return; }
    if (f.type === 'content' || f.type === 'fileupload') return;
    let v = answers[f.id];
    if (f.type === 'repeater') {
      const cols = f.columns[0].fields; const rows = (v || []).filter(r => Object.values(r).some(x => x && String(x).trim()));
      if (!rows.length) return; v = rows.map(r => cols.filter(c => r[c.id] && String(r[c.id]).trim()).map(c => c.label + ': ' + r[c.id]).join(' | '));
    }
    if (v == null || v === '' || (Array.isArray(v) && !v.length)) return;
    out.push({ t: (f.type === 'checkbox' || f.type === 'repeater') ? 'list' : 'text', label: f.label, value: v });
